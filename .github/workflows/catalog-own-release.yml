name: cown-catalog-release
run-name: ${{ inputs.helio_execution_id || format('Owned catalog lane release {0}', github.sha) }}
# Owned catalog lane (23 Oct 2026): pure catalog caller for the BlueMatrix Environment Catalog
# cases. Calls the central catalog template by its full name. No real deployment.
on:
  workflow_dispatch:
    inputs:
      helio_execution_id:
        type: string
        required: false
        default: ''
      helio_target_environment:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  deploy:
    uses: helloangular/helio-client-capacity-20260916/.github/workflows/catalog-own-deploy.yml@catalog-own-20261023
    with:
      helio_execution_id: ${{ inputs.helio_execution_id || '' }}
      helio_target_environment: ${{ inputs.helio_target_environment || '' }}
